name: repsi-production

services:
  api:
    build:
      context: ./app/api
      dockerfile: ../../docker/Dockerfile.api

    container_name: repsi-api

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      FRONTEND_URL: https://repsi.app
      BACKEND_CORS_ORIGINS: '["https://repsi.app","https://www.repsi.app"]'

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
